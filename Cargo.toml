[package]
name = "schnorrkel"
version = "0.11.6"
authors = ["Jeff Burdges <jeff@web3.foundation>"]
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/w3f/schnorrkel"
documentation = "https://docs.rs/schnorrkel"
keywords = ["cryptography", "ed25519", "curve25519", "signature", "ECC"]
categories = ["cryptography", "no-std"]
description = "Schnorr VRF, signatures, etc. using the Ristretto group"
exclude = [".gitignore", "res/*"]
edition = "2021"
rust-version = "1.85"

[dependencies]
aead = { version = "0.6.1", default-features = false, optional = true }
# arrayref = { version = "0.3.7", default-features = false }
# needs to match parity-scale-code which is "=0.7.0"
arrayvec = { version = "0.7.4", default-features = false }
curve25519-dalek = { version = "5.0.0", default-features = false, features = [
    "digest",
    "zeroize",
    "legacy_compatibility",
] }
subtle = { version = "2.4.1", default-features = false }
merlin = { version = "3", git = "https://github.com/mobilecoinofficial/merlin", rev = "cb9528e3a799decf393a02cccb0323134bfdd431", default-features = false }
rand_core = { version = "0.10", default-features = false }
getrandom = { version = "0.4", default-features = false, optional = true }
serde_crate = { version = "1.0.130", package = "serde", default-features = false, optional = true }
serde_bytes = { version = "0.11.5", default-features = false, optional = true }
cfg-if = { version = "1.0.0", optional = true }
sha2 = { version = "0.11", default-features = false }
failure = { version = "0.1.8", default-features = false, optional = true }
zeroize = { version = "1.6", default-features = false, features = ["zeroize_derive"] }
rand_chacha = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
rand = "0.10"
rand_chacha = { version = "0.10", default-features = false }
hex-literal = "1.1.0"
shake = "0.1"
bincode = "1.3.3"
criterion = "0.8.2"
serde_json = "1.0.68"

[[bench]]
name = "schnorr_benchmarks"
harness = false

[features]
default = ["alloc", "getrandom"]
preaudit_deprecated = []
nightly = []
alloc = ["curve25519-dalek/alloc", "serde_bytes/alloc"]
std = ["alloc", "getrandom", "serde_bytes/std", "getrandom?/std"]
# sha2 0.11 picks asm backends by default; kept as a no-op for compatibility.
asm = []
serde = ["serde_crate", "serde_bytes", "cfg-if"]
precomputed-tables = ["curve25519-dalek/precomputed-tables"]
getrandom = ["dep:getrandom", "aead?/getrandom"]
debug-transcript = ["std", "merlin/std", "merlin/debug-transcript"]
aead = ["dep:aead"]
